name: validate

on:
  push:
    branches: [main]
  pull_request:
  # 태그와 브랜치를 연달아 밀면 GitHub 이 브랜치 실행을 건너뛰는 경우가 있다.
  # 그때 손으로 돌릴 수 있게 열어 둔다.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
